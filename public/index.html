<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMAR FOUND Admin</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{padding:20px;background:#111827;color:white}main{max-width:1100px;margin:20px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:16px}input,textarea,select,button{padding:10px;border:1px solid #d1d5db;border-radius:8px}button{cursor:pointer}.row{padding:12px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#fee2e2}.ok{background:#dcfce7}</style><header><h1>AMAR FOUND Admin</h1><div>Server-side admin controller</div></header><main><div class="panel"><label>Admin Telegram ID</label><input id="admin" placeholder="Numeric Telegram ID"><button onclick="loadAll()">Load</button></div><div id="dash" class="grid"></div><div class="panel"><h2>bKash / Nagad Settings</h2><div id="payments"></div></div><div class="panel"><h2>Pending Deposits</h2><div id="deps"></div></div><div class="panel"><h2>Pending Withdrawals</h2><div id="wds"></div></div><div class="panel"><h2>Support Tickets</h2><div id="tickets"></div></div><div class="panel"><h2>Maintenance</h2><textarea id="maint" rows="3" style="width:100%"></textarea><p><label><input type="checkbox" id="men"> Enable maintenance</label></p><button onclick="saveMaint()">Save</button></div></main><script>const h=()=>({'Content-Type':'application/json','x-telegram-admin-id':document.getElementById('admin').value});async function api(p,o={}){let r=await fetch('/admin/api'+p,{...o,headers:{...h(),...(o.headers||{})}});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function loadAll(){try{let d=await api('/dashboard');document.getElementById('dash').innerHTML=Object.entries(d).map(([k,v])=>`<div class=card><b>${k}</b><div style="font-size:28px">${v}</div></div>`).join('');let p=await api('/payments');document.getElementById('payments').innerHTML=p.map(x=>`<div class=row><b>${x.method.toUpperCase()}</b><br><label>Enabled <input type=checkbox id="e_${x.method}" ${x.enabled?'checked':''}></label><br><input id="n_${x.method}" value="${x.account_number||''}" placeholder="Payment number" style="width:100%"><br><textarea id="i_${x.method}" placeholder="Instructions" style="width:100%">${x.instructions||''}</textarea><br><button onclick="savePay('${x.method}')">Save ${x.method}</button></div>`).join('');let ds=await api('/deposits');document.getElementById('deps').innerHTML=ds.filter(x=>x.status==='pending').map(x=>`<div class=row><b>${x.request_id}</b> — ${x.method} — ৳${x.amount} — @${x.username||'-'}<div class=actions><button class=ok onclick="review('deposits',${x.id},'approved')">Approve</button><button class=danger onclick="review('deposits',${x.id},'rejected')">Reject</button></div></div>`).join('')||'No pending deposits';let ws=await api('/withdrawals');document.getElementById('wds').innerHTML=ws.filter(x=>x.status==='pending').map(x=>`<div class=row><b>${x.request_id}</b> — ${x.method} — ${x.account_number} — ৳${x.amount}<div class=actions><button class=ok onclick="review('withdrawals',${x.id},'approved')">Approve</button><button class=danger onclick="review('withdrawals',${x.id},'rejected')">Reject</button></div></div>`).join('')||'No pending withdrawals';let ts=await api('/tickets');document.getElementById('tickets').innerHTML=ts.filter(x=>!['resolved','closed'].includes(x.status)).map(x=>`<div class=row><b>${x.ticket_number}</b> — ${x.category} — ${x.status}<br>${x.message}<br><textarea id="r_${x.id}" placeholder="Reply" style="width:100%"></textarea><button onclick="reply(${x.id})">Reply</button></div>`).join('')||'No open tickets';let m=await api('/maintenance');document.getElementById('men').checked=!!m.enabled;document.getElementById('maint').value=m.message||''}catch(e){alert(e.message)}}async function savePay(m){await api('/payments/'+m,{method:'PUT',body:JSON.stringify({enabled:document.getElementById('e_'+m).checked,account_number:document.getElementById('n_'+m).value,instructions:document.getElementById('i_'+m).value})});alert('Saved')}async function review(t,id,s){await api('/'+t+'/'+id+'/review',{method:'POST',body:JSON.stringify({status:s,note:''})});loadAll()}async function reply(id){await api('/tickets/'+id+'/reply',{method:'POST',body:JSON.stringify({reply:document.getElementById('r_'+id).value,status:'reply'})});loadAll()}async function saveMaint(){await api('/maintenance',{method:'PUT',body:JSON.stringify({enabled:document.getElementById('men').checked,message:document.getElementById('maint').value})});alert('Saved')}</script></html>
